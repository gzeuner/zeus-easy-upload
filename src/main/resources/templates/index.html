<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zeus Easy Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm mb-4"><div class="container"><a class="navbar-brand fw-semibold" th:href="@{/}">Zeus Easy Upload</a><div class="navbar-nav"><a class="nav-link active" th:href="@{/}">Import</a><a class="nav-link" th:href="@{/connections}">Verbindungen</a></div></div></nav>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4 class="mb-0">CSV Import</h4>
                </div>
                <div class="card-body">
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                    <form th:action="@{/upload}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="file" class="form-label">CSV File</label>
                            <input class="form-control" id="file" name="file" type="file" accept=".csv,text/csv" required>
                        </div>
                        <div class="card border-0 bg-light mb-4">
                            <div class="card-body">
                                <h6 class="mb-3">Import mode</h6>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="importMode" id="modeCreate"
                                           value="create" checked>
                                    <label class="form-check-label" for="modeCreate">
                                        <strong>Neue Tabelle anlegen</strong> — Typen vorschlagen, CREATE TABLE + INSERT
                                    </label>
                                </div>
                                <div class="form-check mt-2">
                                    <input class="form-check-input" type="radio" name="importMode" id="modeExisting"
                                           value="existing">
                                    <label class="form-check-label" for="modeExisting">
                                        <strong>In vorhandene Tabelle schreiben</strong> — Spalten mappen, typisiert INSERT
                                    </label>
                                </div>
                                <input type="hidden" name="useExistingTable" id="useExistingTable" value="false">
                            </div>
                        </div>
                        <div class="card border-0 bg-light mb-4">
                            <div class="card-body">
                                <h6 class="mb-3">CSV Settings</h6>
                                <div class="row">
                                    <div class="col-md-4 mb-2">
                                        <label for="csvDelimiter" class="form-label">Delimiter</label>
                                        <select class="form-select" id="csvDelimiter" name="csvDelimiter">
                                            <option value="">Auto-detect</option>
                                            <option value=",">Comma (,)</option>
                                            <option value=";">Semicolon (;)</option>
                                            <option value="|">Pipe (|)</option>
                                            <option value="&#9;">Tab</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4 mb-2">
                                        <label for="csvEncoding" class="form-label">Encoding</label>
                                        <select class="form-select" id="csvEncoding" name="csvEncoding">
                                            <option value="UTF-8" selected>UTF-8</option>
                                            <option value="windows-1252">Windows-1252</option>
                                            <option value="ISO-8859-1">ISO-8859-1</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4 mb-2">
                                        <label for="csvQuote" class="form-label">Quote</label>
                                        <input class="form-control" id="csvQuote" name="csvQuote" value="&quot;" maxlength="1">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="connectionProfileName" class="form-label">Database connection</label>
                            <select class="form-select" id="connectionProfileName" name="connectionProfileName">
                                <option value="">Default (application DataSource)</option>
                                <option th:each="conn : ${jdbcConnections}"
                                        th:value="${conn.name}"
                                        th:text="${conn.name + ' — ' + conn.endpoint}"
                                        th:selected="${importRequest.connectionProfileName == conn.name}"></option>
                            </select>
                            <div class="form-text">
                                Optional named profile from <a th:href="@{/connections}">Verbindungen</a>.
                                Secrets stay encrypted; never enter passwords here.
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="library" class="form-label">Library (Schema)</label>
                                <input class="form-control" id="library" name="library" th:value="${importRequest.library}" required>
                            </div>
                            <div class="col-md-6 mb-3" id="createTableNameGroup">
                                <label for="tableName" class="form-label">New table name</label>
                                <input class="form-control" id="tableName" name="tableName" th:value="${importRequest.tableName}">
                            </div>
                        </div>
                        <div class="form-check mb-4" id="dropAndRecreateGroup">
                            <input class="form-check-input" type="checkbox" id="dropAndRecreate" name="dropAndRecreate">
                            <label class="form-check-label" for="dropAndRecreate">Drop table before create</label>
                        </div>
                        <div class="card border-0 bg-light mb-4 d-none" id="existingTableGroup">
                            <div class="card-body">
                                <h6 class="mb-3">Ziel-Tabelle</h6>
                                <div class="mb-2">
                                    <label for="existingTableSelect" class="form-label">Existing table</label>
                                    <select class="form-select" id="existingTableSelect" name="existingTableName" disabled>
                                        <option value="">Select table...</option>
                                    </select>
                                </div>
                                <div id="existingTableStatus" class="form-text"></div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Upload and Analyze</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    (() => {
        const libraryInput = document.getElementById("library");
        const connectionSelect = document.getElementById("connectionProfileName");
        const useExistingTable = document.getElementById("useExistingTable");
        const existingTableSelect = document.getElementById("existingTableSelect");
        const status = document.getElementById("existingTableStatus");
        const modeCreate = document.getElementById("modeCreate");
        const modeExisting = document.getElementById("modeExisting");
        const createTableNameGroup = document.getElementById("createTableNameGroup");
        const dropAndRecreateGroup = document.getElementById("dropAndRecreateGroup");
        const existingTableGroup = document.getElementById("existingTableGroup");
        const tableNameInput = document.getElementById("tableName");

        if (!libraryInput || !useExistingTable || !existingTableSelect || !status) {
            return;
        }

        const isExistingMode = () => modeExisting && modeExisting.checked;

        const applyModeUi = () => {
            const existing = isExistingMode();
            useExistingTable.value = existing ? "true" : "false";
            if (createTableNameGroup) {
                createTableNameGroup.classList.toggle("d-none", existing);
            }
            if (dropAndRecreateGroup) {
                dropAndRecreateGroup.classList.toggle("d-none", existing);
            }
            if (existingTableGroup) {
                existingTableGroup.classList.toggle("d-none", !existing);
            }
            if (tableNameInput) {
                tableNameInput.required = !existing;
            }
            if (existing) {
                fetchTables();
            } else {
                resetSelect("");
            }
        };

        const resetSelect = (message) => {
            existingTableSelect.innerHTML = "<option value=''>Select table...</option>";
            existingTableSelect.disabled = true;
            status.textContent = message || "";
        };

        const fillSelect = (tables) => {
            existingTableSelect.innerHTML = "<option value=''>Select table...</option>";
            tables.forEach((table) => {
                const option = document.createElement("option");
                option.value = table.tableName;
                option.textContent = table.tableName;
                existingTableSelect.appendChild(option);
            });
            existingTableSelect.disabled = tables.length === 0;
            status.textContent = tables.length === 0 ? "No tables found for this library." : "";
        };

        const fetchTables = async () => {
            if (!isExistingMode()) {
                resetSelect("");
                return;
            }

            const library = libraryInput.value.trim();
            if (!library) {
                resetSelect("Enter a library first.");
                return;
            }

            status.textContent = "Loading tables...";
            try {
                let url = `/meta/tables?library=${encodeURIComponent(library)}`;
                const connection = connectionSelect && connectionSelect.value ? connectionSelect.value.trim() : "";
                if (connection) {
                    url += `&connectionProfileName=${encodeURIComponent(connection)}`;
                }
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error("Metadata endpoint returned " + response.status);
                }
                const tables = await response.json();
                fillSelect(Array.isArray(tables) ? tables : []);
            } catch (error) {
                resetSelect("Could not load tables.");
            }
        };

        if (modeCreate) {
            modeCreate.addEventListener("change", applyModeUi);
        }
        if (modeExisting) {
            modeExisting.addEventListener("change", applyModeUi);
        }
        libraryInput.addEventListener("change", () => {
            if (isExistingMode()) {
                fetchTables();
            }
        });
        if (connectionSelect) {
            connectionSelect.addEventListener("change", () => {
                if (isExistingMode()) {
                    fetchTables();
                }
            });
        }
        applyModeUi();
    })();
</script>
</body>
</html>
